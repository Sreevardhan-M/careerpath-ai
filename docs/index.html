<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerPath AI | Career guidance for CSE students</title>
<meta name="description" content="Browser-only demo of CareerPath AI. Data is saved in your browser.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* CareerPath AI. Dark, minimal, one teal accent. */
:root {
  --bg: #0a0b0d;
  --surface: #111317;
  --surface-2: #171a1f;
  --line: #22262d;
  --line-2: #2f343d;
  --text: #f3f4f6;
  --muted: #9aa1ac;
  --faint: #6b7280;
  --accent: #2dd4bf;
  --accent-ink: #04201c;
  --accent-soft: rgba(45, 212, 191, 0.12);
  --warn: #f2b84b;
  --warn-soft: rgba(242, 184, 75, 0.12);
  --danger: #f08080;
  --danger-soft: rgba(240, 128, 128, 0.12);
  --radius: 8px;
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding: 90px 0 110px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; letter-spacing: -0.025em; font-weight: 700; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -0.035em; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; margin: 1.1rem 0 0.4rem; }
p { margin: 0 0 0.8rem; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: #6eead9; }
ul, ol { margin: 0; padding: 0; }
img, svg { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--accent); color: var(--accent-ink); }

.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 8px; top: -60px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 6px; z-index: 100; font-weight: 700; text-decoration: none; }
.skip-link:focus { top: 8px; }
.muted { color: var(--muted); }
.center { text-align: center; margin-top: 1.2rem; }
.overdue { color: var(--danger); margin: 0; }

/* Buttons and links */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); font: 600 0.95rem var(--font); cursor: pointer; text-decoration: none; transition: background 0.15s, border-color 0.15s, color 0.15s; }
.btn:hover { background: #1f232a; border-color: #3b414b; color: var(--text); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn-primary:hover { background: #5ee6d4; border-color: #5ee6d4; color: var(--accent-ink); }
.btn-ghost { background: transparent; }
.btn-danger { background: var(--danger-soft); border-color: #5b3434; color: var(--danger); }
.btn-danger:hover { background: #3a2222; color: #ffb0b0; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 0.86rem; }
.btn-lg { min-height: 52px; padding: 0 26px; font-size: 1.02rem; }
.btn-block { width: 100%; }
.btn-on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); font: 600 0.9rem var(--font); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--text); }
.link-btn.danger:hover { color: var(--danger); }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 1rem 0 0; }

/* Brand */
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-weight: 800; letter-spacing: -0.02em; text-decoration: none; font-size: 1.05rem; }
.brand:hover { color: var(--text); }
.brand-mark { color: var(--accent); }

/* Pills, bars, meters */
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.01em; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.pill-ok { color: var(--accent); background: var(--accent-soft); border-color: rgba(45, 212, 191, 0.35); }
.pill-mid { color: var(--warn); background: var(--warn-soft); border-color: rgba(242, 184, 75, 0.35); }
.pill-low { color: var(--danger); background: var(--danger-soft); border-color: rgba(240, 128, 128, 0.35); }
.pill-accent { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar-fill { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width 0.7s cubic-bezier(0.2, 0.7, 0.2, 1); }
.meter { display: inline-flex; gap: 3px; }
.meter span { width: 14px; height: 6px; border-radius: 2px; background: var(--line-2); }
.meter span.on { background: var(--accent); }
.gapbar { position: relative; height: 10px; border-radius: 3px; background: var(--line); margin: 6px 0 4px; }
.gapbar-fill { display: block; height: 100%; width: 0; border-radius: 3px; transition: width 0.7s cubic-bezier(0.2, 0.7, 0.2, 1); }
.gapbar-strong { background: var(--accent); }
.gapbar-improve { background: var(--warn); }
.gapbar-missing { background: var(--danger); }
.gapbar-target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); transform: translateX(-1px); }
.legend { color: var(--muted); font-size: 0.85rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.legend-fill { width: 18px; height: 8px; background: var(--accent); border-radius: 2px; display: inline-block; }
.legend-target { width: 2px; height: 14px; background: var(--text); display: inline-block; margin-left: 10px; }
.ring { position: relative; flex: none; }
.ring-track { stroke: var(--line); }
.ring-arc { stroke: var(--accent); transition: stroke-dashoffset 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring-label strong { font-size: 1.5rem; letter-spacing: -0.03em; }
.ring-label span { font-size: 0.72rem; color: var(--muted); }

/* Forms */
.field { margin: 0 0 1.1rem; }
.field label, .label-like, .filter label, .select-row label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
.hint { color: var(--muted); font-size: 0.85rem; margin: -2px 0 6px; }
.error { color: var(--danger); font-size: 0.86rem; margin: 6px 0 0; font-weight: 500; }
.error:empty { display: none; }
.success { color: var(--accent); font-size: 0.86rem; margin: 6px 0 0; }
.form-error { background: var(--danger-soft); border: 1px solid #5b3434; color: #ffb4b4; padding: 10px 14px; border-radius: var(--radius); margin: 0 0 1.2rem; }
.input, .select { width: 100%; min-height: 44px; padding: 9px 12px; background: var(--surface); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--radius); font: 500 0.95rem var(--font); }
.input::placeholder { color: var(--faint); }
.input:hover, .select:hover { border-color: #434a55; }
.input:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.has-error .input, .has-error .select, .input[aria-invalid='true'] { border-color: var(--danger); }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.select option { background: var(--surface-2); }
.fieldset { border: 0; padding: 0; margin: 0 0 1.4rem; min-width: 0; }
.fieldset legend { font-weight: 700; font-size: 0.95rem; padding: 0; margin-bottom: 8px; }
.fieldset-tight { margin-bottom: 0.8rem; }
.static-value { margin: 0; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: var(--radius); color: var(--muted); }
.check { display: inline-flex; align-items: flex-start; gap: 10px; cursor: pointer; font-weight: 500; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.choices { display: grid; gap: 8px; }
.choices-row { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.choice, .chip { position: relative; display: block; cursor: pointer; }
.choice input, .chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.choice-box { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); font-weight: 600; transition: border-color 0.15s, background 0.15s; }
.choice input:checked + .choice-box { border-color: var(--accent); background: var(--accent-soft); }
.choice input:focus-visible + .choice-box, .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice-sub { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip span { display: inline-block; padding: 8px 14px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); font-size: 0.9rem; font-weight: 600; transition: border-color 0.15s, background 0.15s, color 0.15s; }
.chip:hover span { border-color: #434a55; }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips-sm .chip span { padding: 5px 11px; font-size: 0.82rem; }
.segmented { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; }
.seg { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.seg span { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--surface); font-size: 0.8rem; font-weight: 600; text-align: center; transition: background 0.15s, border-color 0.15s; }
.seg b { font-size: 1rem; }
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.level-desc { margin: 8px 0 0; color: var(--muted); font-size: 0.86rem; }
.note { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line-2); padding: 10px 14px; border-radius: var(--radius); color: var(--muted); font-size: 0.9rem; }
.note strong { color: var(--text); }
.source { color: var(--muted); font-size: 0.88rem; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.source strong { color: var(--text); }
.source-ai strong { color: var(--accent); }
.ai-expl { background: var(--accent-soft); border: 1px solid rgba(45, 212, 191, 0.25); padding: 10px 14px; border-radius: var(--radius); font-size: 0.92rem; }
.ai-expl strong { color: var(--accent); }

/* Tables and lists */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
.table { width: 100%; border-collapse: collapse; font-size: 0.92rem; min-width: 480px; }
.table th, .table td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.table thead th { color: var(--muted); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; background: var(--surface); }
.table tbody tr:last-child > * { border-bottom: 0; }
.plain { list-style: none; }
.plain li { padding: 5px 0; }
.plain.spaced li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.plain.spaced li:last-child { border-bottom: 0; }
.plain.spaced p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.tags { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.tags li { padding: 3px 10px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 0.82rem; color: var(--muted); }
.tags-ok li { color: var(--accent); border-color: rgba(45, 212, 191, 0.35); }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }
.h-sm { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 1.1rem 0 0.4rem; }
.crumb { color: var(--muted); font-size: 0.9rem; }

/* Skeleton and empty states */
.skeleton-wrap { max-width: 900px; }
.skel { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 6px; }
.skel-title { height: 34px; width: 40%; margin-bottom: 22px; }
.skel-row { height: 64px; margin-bottom: 12px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.empty { padding: 22px; border: 1px dashed var(--line-2); border-radius: var(--radius); text-align: center; color: var(--muted); }
.empty h3 { color: var(--text); margin-bottom: 6px; }
.empty p { margin-bottom: 12px; }
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 90; }
.toast { background: var(--surface-2); border: 1px solid var(--line-2); padding: 11px 16px; border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); animation: toast-in 0.2s ease; max-width: 360px; font-size: 0.92rem; }
.toast-error { border-color: #6b3a3a; color: #ffbcbc; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: grid; place-items: center; z-index: 80; padding: 16px; }
.dialog { background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 24px; max-width: 440px; width: 100%; }
.dialog h2 { margin-bottom: 10px; }
.dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

/* App shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 20px; background: var(--bg); overflow-y: auto; }
.sidebar .brand { padding: 0 10px; }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.nav-link { display: flex; gap: 12px; align-items: baseline; padding: 9px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.93rem; transition: background 0.15s, color 0.15s; }
.nav-link:hover { color: var(--text); background: var(--surface); }
.nav-link[aria-current='page'] { color: var(--text); background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
.nav-idx { font-variant-numeric: tabular-nums; font-size: 0.72rem; color: var(--faint); }
.nav-link[aria-current='page'] .nav-idx { color: var(--accent); }
.sidebar-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.who { display: flex; flex-direction: column; line-height: 1.3; }
.who span { color: var(--muted); font-size: 0.8rem; }
.main { padding: 40px clamp(20px, 4vw, 56px) 80px; max-width: 1120px; width: 100%; min-width: 0; outline: none; }
.topbar, .scrim { display: none; }
.page-in { animation: page-in 0.25s ease both; }
@keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 1.6rem; }
.page-head h1 { outline: none; }
.lede { color: var(--muted); max-width: 62ch; margin: 8px 0 0; }
.section-h { margin: 2rem 0 0.9rem; }
.panel { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 22px; margin: 0 0 18px; }
.panel > h2 { margin-bottom: 12px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.cols > .panel { margin-bottom: 0; }
.cols + .cols, .cols + .panel, .panel + .cols { margin-top: 18px; }
.ledger { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 22px; background: var(--surface); }
.stat { padding: 18px 20px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat-label { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; }
.stat-value { font-size: 1.8rem; letter-spacing: -0.03em; font-weight: 800; }
.stat-sub { color: var(--muted); font-size: 0.82rem; }
.rank-list { list-style: none; counter-reset: r; }
.rank-list li { counter-increment: r; display: flex; justify-content: space-between; gap: 14px; padding: 12px 0 12px 34px; border-bottom: 1px solid var(--line); position: relative; }
.rank-list li::before { content: counter(r); position: absolute; left: 0; top: 12px; color: var(--accent); font-weight: 800; }
.rank-list li:last-of-type { border-bottom: 0; }
.rank-list p { margin: 2px 0 0; font-size: 0.88rem; }
.rank-title { color: var(--text); font-weight: 700; text-decoration: none; }
.rank-title:hover { color: var(--accent); }
.gap-counts { display: flex; gap: 20px; flex-wrap: wrap; color: var(--muted); }
.gap-counts strong { font-size: 1.5rem; color: var(--text); }
.skill-lines { list-style: none; }
.skill-lines li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.skill-lines li:last-child { border-bottom: 0; }
.mini-level { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.85rem; }
.ring-row { display: flex; gap: 18px; align-items: center; }
.ring-row > div:last-child { flex: 1; }
.activity { list-style: none; }
.activity li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
.activity li:last-child { border-bottom: 0; }
.activity time { color: var(--muted); white-space: nowrap; font-size: 0.82rem; }
.boot-error { padding: 80px 24px; max-width: 560px; margin: 0 auto; }

/* Careers */
.career-list { display: grid; gap: 16px; }
.career { display: grid; grid-template-columns: 56px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 18px; }
.career-list .career { margin-bottom: 0; }
.career-rank { font-size: 2rem; font-weight: 800; color: var(--accent); padding: 18px 0 0 20px; letter-spacing: -0.04em; }
.career-body { padding: 20px 22px 22px 6px; min-width: 0; }
.career-title { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
.career-summary { color: var(--muted); }
.reasons { padding-left: 1.1rem; color: #d3d6db; }
.reasons li { margin-bottom: 4px; }
.career-ready { display: grid; gap: 6px; margin-top: 16px; font-weight: 600; font-size: 0.92rem; }
.career-ready .muted { font-weight: 400; font-size: 0.84rem; }
.phase-outline { padding-left: 1.2rem; }
.phase-outline li { padding: 6px 0; }

/* Gap */
.select-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.select-row label { margin: 0; }
.select-row .select { max-width: 320px; }
.gap-list { list-style: none; }
.gap-row { padding: 16px 0; border-bottom: 1px solid var(--line); }
.gap-row:last-child { border-bottom: 0; }
.gap-name { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.gap-levels { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.84rem; margin-top: 4px; }
.gap-main p { margin: 6px 0 0; font-size: 0.88rem; }
.gap-res, .task-res, .covered { margin-top: 10px; }
.gap-res summary, .task-res summary, .covered summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.9rem; }
.gap-res .resource-list, .task-res .resource-list { margin-top: 10px; }

/* Resources */
.filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; margin: 18px 0 14px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.filters .filter:first-child { grid-column: 1 / -1; }
.filter-checks { grid-column: 1 / -1; display: flex; gap: 22px; flex-wrap: wrap; align-items: center; }
.resource-list { display: grid; gap: 10px; }
.resource { display: flex; justify-content: space-between; gap: 18px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.panel .resource, .task-res .resource { background: var(--bg); }
.resource.is-done { opacity: 0.7; }
.resource-main { min-width: 0; }
.resource-title { font-size: 1rem; margin-bottom: 2px; }
.resource-title a { color: var(--text); text-decoration-color: var(--line-2); }
.resource-title a:hover { color: var(--accent); }
.resource-meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 6px; }
.resource-desc { font-size: 0.92rem; margin-bottom: 4px; color: #cfd2d8; }
.resource-cost { color: var(--faint); font-size: 0.8rem; margin: 0; }
.resource-actions { display: flex; flex-direction: column; gap: 8px; flex: none; }
.for-gap { color: var(--accent); font-weight: 700; }

/* Roadmap */
.roadmap-overall { display: flex; gap: 20px; align-items: center; margin: 16px 0; }
.phases { display: grid; gap: 12px; margin-top: 16px; }
.phase { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.phase > summary { display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer; list-style: none; flex-wrap: wrap; }
.phase > summary::-webkit-details-marker { display: none; }
.phase-n { color: var(--accent); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; }
.phase-title { font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 140px; }
.phase-body { padding: 0 20px 20px; border-top: 1px solid var(--line); padding-top: 16px; }
.tasks { list-style: none; }
.task { padding: 12px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task-head { display: flex; justify-content: space-between; gap: 12px; }
.task.is-done .check span { color: var(--muted); text-decoration: line-through; }
.task-detail { margin: 4px 0 0 28px; font-size: 0.88rem; }

/* Progress and goals */
.overall { display: flex; gap: 26px; align-items: center; }
.meter-pair { display: grid; gap: 6px; max-width: 480px; font-size: 0.9rem; font-weight: 600; }
.phase-bars { list-style: none; display: grid; gap: 12px; }
.phase-bars li { display: grid; grid-template-columns: 240px 1fr 90px; gap: 14px; align-items: center; font-size: 0.92rem; }
.goals { list-style: none; }
.goals li { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.goals li.is-done .check span { text-decoration: line-through; color: var(--muted); }
.goal-form { display: grid; grid-template-columns: 1fr 200px auto; gap: 0 14px; align-items: end; margin-top: 18px; }
.goal-form .field { margin-bottom: 0; }
.goal-form .error { grid-column: 1 / -1; }
.achievements { list-style: none; }
.achievements li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.achievements li p { margin: 0; }
.chart { margin: 10px 0 0; }
.chart svg { width: 100%; height: auto; display: block; }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-tick { fill: var(--faint); font-size: 10px; font-family: var(--font); }
.chart-val { fill: var(--muted); font-size: 10px; font-family: var(--font); font-weight: 700; }
.chart-bar { fill: var(--accent); }
.chart-line { stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart-dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }

/* Skills and profile */
.save-status { color: var(--muted); font-size: 0.85rem; min-height: 1.4em; }
.skill-items { list-style: none; }
.skill-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.skill-item:last-child { border-bottom: 0; }
.skill-line { display: grid; grid-template-columns: minmax(120px, 1.2fr) auto 190px auto auto; gap: 14px; align-items: center; }
.skill-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; align-items: end; margin-top: 12px; padding: 14px; background: var(--bg); border-radius: var(--radius); }
.skill-details .field { margin-bottom: 0; }
.add-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 14px; }
.completion { display: flex; gap: 26px; align-items: center; }
.checklist { list-style: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 24px; font-size: 0.9rem; }
.checklist li { color: var(--muted); display: flex; gap: 10px; }
.checklist li.ok { color: var(--text); }
.check-mark { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; width: 38px; flex: none; color: var(--faint); padding-top: 3px; }
.ok .check-mark { color: var(--accent); }
.entries { list-style: none; margin-bottom: 12px; }
.entries li { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.entries p { margin: 2px 0 0; font-size: 0.88rem; }
.add-box { padding: 16px; border: 1px dashed var(--line-2); border-radius: var(--radius); }
.danger-zone { border-color: #4a2c2c; }

/* Landing */
.landing { max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); }
.l-nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; }
.l-nav-links { display: flex; gap: 22px; }
.l-nav-links .link-btn { text-decoration: none; }
.hero { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; align-items: center; padding: clamp(40px, 8vw, 96px) 0 clamp(48px, 8vw, 96px); }
.eyebrow { color: var(--accent); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
.hero h1 { font-size: clamp(2.8rem, 7vw, 5.2rem); line-height: 1; letter-spacing: -0.05em; font-weight: 800; }
.hero-sub { font-size: clamp(1.05rem, 2vw, 1.3rem); color: var(--muted); max-width: 34ch; margin: 24px 0 32px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.sample { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 20px; position: relative; }
.sample-tag { position: absolute; top: 12px; right: 14px; margin: 0; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
.mini-list { display: grid; gap: 2px; }
.mini-title { font-weight: 700; margin: 0 0 8px; }
.mini-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
.mini-row:last-of-type { border-bottom: 0; }
.mini-k { color: var(--muted); }
.mini-bar { flex: 1; max-width: 60%; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.mini-bar span { display: block; height: 100%; background: var(--accent); }
.mini-foot { color: var(--faint); font-size: 0.8rem; margin: 10px 0 0; }
.mini-career { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini-career:last-child { border-bottom: 0; }
.mini-career p { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
.mini-rank { color: var(--accent); font-weight: 800; font-size: 1.3rem; width: 18px; }
.mini-fit { margin-left: 10px; font-size: 0.72rem; color: var(--accent); font-weight: 700; }
.mini-res { display: flex; flex-direction: column; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini-res span { color: var(--muted); font-size: 0.82rem; }
.mini-bars { display: flex; align-items: flex-end; gap: 8px; height: 100px; margin: 8px 0 14px; }
.mini-bars span { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; }
.explain { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; padding: 56px 0; border-top: 1px solid var(--line); }
.explain-lead { font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: -0.03em; font-weight: 700; line-height: 1.2; margin: 0; }
.explain-body p { color: var(--muted); }
.features { padding: 56px 0 24px; border-top: 1px solid var(--line); }
.section-head { margin-bottom: 40px; }
.section-head h2 { font-size: clamp(1.8rem, 4vw, 2.8rem); letter-spacing: -0.04em; }
.feature { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; padding: 44px 0; border-top: 1px solid var(--line); }
.feature:nth-of-type(even) .feature-copy { order: 2; }
.feature-n { color: var(--accent); font-weight: 800; font-size: 0.85rem; letter-spacing: 0.08em; }
.feature-copy h3 { font-size: clamp(1.5rem, 3vw, 2.1rem); letter-spacing: -0.04em; margin: 8px 0 14px; }
.feature-copy p { color: var(--muted); max-width: 46ch; }
.feature-copy ul { list-style: none; margin-top: 16px; display: grid; gap: 6px; font-weight: 600; font-size: 0.92rem; }
.feature-copy li::before { content: ''; display: inline-block; width: 14px; height: 2px; background: var(--accent); vertical-align: middle; margin-right: 10px; }
.how { padding: 56px 0; border-top: 1px solid var(--line); }
.steps { list-style: none; display: grid; }
.steps li { display: grid; grid-template-columns: 70px 1fr; gap: 16px; padding: 26px 0; border-top: 1px solid var(--line); align-items: baseline; }
.step-n { font-size: 2.4rem; font-weight: 800; color: var(--accent); letter-spacing: -0.05em; }
.steps h3 { font-size: 1.3rem; margin-bottom: 4px; }
.steps p { color: var(--muted); margin: 0; }
.final { padding: 80px 0; text-align: center; border-top: 1px solid var(--line); }
.final h2 { font-size: clamp(1.8rem, 4.5vw, 3.2rem); letter-spacing: -0.045em; max-width: 18ch; margin: 0 auto 14px; }
.final p { color: var(--muted); margin-bottom: 28px; }
.l-foot { border-top: 1px solid var(--line); padding: 40px 0 30px; }
.l-foot-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 32px; }
.l-foot h4 { margin-top: 0; }
.l-foot ul { list-style: none; display: grid; gap: 6px; }
.l-foot a, .l-foot .link-btn { color: var(--muted); text-decoration: none; font-weight: 500; }
.l-foot a:hover, .l-foot .link-btn:hover { color: var(--text); }
.foot-note, .foot-legal { color: var(--faint); font-size: 0.85rem; margin-top: 12px; }
.foot-legal { margin-top: 30px; }

/* Onboarding and auth */
.onb { min-height: 100vh; display: flex; flex-direction: column; }
.onb-top { display: flex; justify-content: space-between; align-items: center; padding: 18px clamp(20px, 4vw, 40px); border-bottom: 1px solid var(--line); }
.onb-rail { list-style: none; display: flex; justify-content: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rail-btn { background: none; border: 0; display: flex; gap: 8px; align-items: center; padding: 6px 12px; color: var(--faint); font: 600 0.88rem var(--font); cursor: pointer; border-radius: 999px; }
.rail-btn:disabled { cursor: default; }
.rail-n { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 0.78rem; }
.onb-rail .current .rail-btn { color: var(--text); }
.onb-rail .current .rail-n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.onb-rail .done .rail-btn { color: var(--muted); }
.onb-rail .done .rail-n { border-color: var(--accent); color: var(--accent); }
.onb-main { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 36px 20px 40px; }
.onb-step h1 { outline: none; margin-bottom: 6px; }
.onb-step .lede { margin-bottom: 28px; }
.onb-step h2 { margin: 28px 0 12px; font-size: 1.15rem; }
.in-fwd { animation: slide-fwd 0.28s ease both; }
.in-back { animation: slide-back 0.28s ease both; }
@keyframes slide-fwd { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes slide-back { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
.onb-foot { position: sticky; bottom: 0; display: flex; justify-content: space-between; gap: 12px; padding: 14px clamp(20px, 4vw, 40px); background: var(--bg); border-top: 1px solid var(--line); }
.onb-foot .btn-primary { margin-left: auto; }
.add-skill-row { display: grid; grid-template-columns: 1fr 220px auto; gap: 10px; }
.rating { padding: 16px 0; border-bottom: 1px solid var(--line); }
.rating-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
.xp-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 14px; align-items: end; padding: 14px 0; border-bottom: 1px solid var(--line); }
.xp-name { grid-column: 1 / -1; margin-bottom: 8px; }
.xp-row .field { margin-bottom: 0; }
.xp-row .check { grid-column: 1 / -1; margin-top: 10px; }
.review-sec { padding: 20px 0; border-bottom: 1px solid var(--line); }
.review-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.review-head h2 { margin: 0; }
.review-sec .table-wrap { margin-top: 4px; }
.auth { min-height: 100vh; padding: 24px clamp(20px, 4vw, 40px); }
.auth-card { max-width: 420px; margin: 12vh auto 0; }
.auth-card h1 { margin-bottom: 6px; }
.auth-form { margin-top: 24px; }
.auth-alt { margin-top: 20px; color: var(--muted); text-align: center; }
.gen { max-width: 480px; margin: 22vh auto 0; padding: 0 20px; }
.gen-list { list-style: none; margin: 24px 0; display: grid; gap: 10px; }
.gen-list li { color: var(--faint); transition: color 0.3s; }
.gen-list li.on { color: var(--text); }
.gen-list li.on::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 12px; }
.gen-bar { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
.gen-bar span { display: block; height: 100%; width: 0; background: var(--accent); animation: gen 1.7s ease forwards; }
@keyframes gen { to { width: 100%; } }

/* Responsive */
@media (max-width: 960px) {
  .hero, .explain, .feature { grid-template-columns: 1fr; gap: 32px; }
  .feature:nth-of-type(even) .feature-copy { order: 0; }
  .ledger { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
  .cols { grid-template-columns: 1fr; }
  .filters { grid-template-columns: repeat(2, 1fr); }
  .skill-line { grid-template-columns: 1fr auto; }
  .skill-line .select { grid-column: 1 / -1; grid-row: 2; }
  .add-grid { grid-template-columns: repeat(2, 1fr); }
  .phase-bars li { grid-template-columns: 1fr; gap: 6px; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 30; }
  .menu-btn { background: var(--surface-2); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 8px 14px; font: 600 0.9rem var(--font); cursor: pointer; }
  .sidebar { position: fixed; left: 0; top: 0; width: 280px; z-index: 50; transform: translateX(-100%); transition: transform 0.22s ease; }
  .sidebar.open { transform: none; }
  .scrim.show { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 40; }
  .main { padding-top: 24px; }
}
@media (max-width: 640px) {
  .l-nav-links { display: none; }
  .two-col, .kv, .skill-details, .xp-row, .goal-form, .add-skill-row, .checklist, .l-foot-grid { grid-template-columns: 1fr; }
  .kv { gap: 2px; }
  .kv dd { margin-bottom: 10px; }
  .filters { grid-template-columns: 1fr; }
  .resource { flex-direction: column; }
  .resource-actions { flex-direction: row; flex-wrap: wrap; }
  .career { grid-template-columns: minmax(0, 1fr); }
  .career-rank { padding: 16px 20px 0; font-size: 1.5rem; }
  .career-body { padding: 8px 18px 20px; }
  .ledger { grid-template-columns: 1fr 1fr; }
  .stat { padding: 14px; }
  .stat-value { font-size: 1.4rem; }
  .completion, .overall, .ring-row, .roadmap-overall { flex-direction: column; align-items: flex-start; }
  .page-head { flex-direction: column; }
  .add-grid { grid-template-columns: 1fr; }
  .steps li { grid-template-columns: 48px 1fr; }
  .goals li { grid-template-columns: 1fr; gap: 4px; }
  .onb-foot .btn { flex: 1; }
  #toasts { left: 16px; right: 16px; }
  .rail-l { display: none; }
  .onb-rail .current .rail-l { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* Fit pills must keep their natural size inside flex rows */
.rank-list li .pill, .career-title .pill { flex: none; align-self: flex-start; }
.rank-list li > div { min-width: 0; }

</style>
